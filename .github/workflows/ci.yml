name: "Continuous Integration"

run-name: "Continuous Integration • ${{ github.ref_name }} @${{ github.actor }}"

concurrency:
    group: "ci-${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

on:
    push:
        branches:
            - "main"
    pull_request:
    merge_group:
        types:
            - "checks_requested"

jobs:
    test:
        name: "Test (${{ matrix.label }})"
        runs-on: "${{ matrix.os }}"
        timeout-minutes: 60
        permissions:
            contents: "read"
            id-token: "write"
        strategy:
            fail-fast: true
            matrix:
                include:
                    - label: "linux"
                      os: "ubuntu-latest"
                      codecov_flag: "os-linux"
                    - label: "windows"
                      os: "windows-latest"
                      codecov_flag: "os-windows"
                    - label: "macos"
                      os: "macos-latest"
                      codecov_flag: "os-macos"
        defaults:
            run:
                shell: "bash"
        env:
            CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}"

        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              if: "${{ matrix.os == 'ubuntu-latest' }}"
              uses: "step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40" # v2.20.1
              with:
                  egress-policy: "audit"

            - name: "Checkout repository"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

            - name: "Setup Node.js without package-manager caching"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"
                  package-manager-cache: false

            - name: "Install the declared npm version"
              id: "npm-toolchain"
              working-directory: "${{ runner.temp }}"
              run: |
                  set -euo pipefail
                  node "$GITHUB_WORKSPACE/scripts/setup-npm-toolchain.mjs" >> "$GITHUB_OUTPUT"

            - name: "Restore npm download cache"
              uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
              with:
                  path: "${{ steps.npm-toolchain.outputs.cache }}"
                  key: "${{ runner.os }}-${{ runner.arch }}-npm-${{ steps.npm-toolchain.outputs.version }}-${{ hashFiles('package-lock.json') }}"
                  restore-keys: |
                      ${{ runner.os }}-${{ runner.arch }}-npm-${{ steps.npm-toolchain.outputs.version }}-

            - name: "Install dependencies"
              run: "npm ci"

            - name: "Build package"
              run: "npm run build"

            - name: "Lint without cache"
              run: "npm run lint:nocache"

            - name: "Upload bundle analysis to Codecov"
              if: "${{ matrix.os == 'ubuntu-latest' && !cancelled() && env.CODECOV_TOKEN != '' }}"
              continue-on-error: true
              run: >-
                  npm exec --yes --ignore-scripts --package=@codecov/bundle-analyzer@2.0.1 -- bundle-analyzer ./dist --bundle-name=${{ github.repository }} --upload-token="${CODECOV_TOKEN}"
              env:
                  GITHUB_SHA: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
                  GITHUB_REF: "${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.head_ref) || github.ref }}"

            - name: "Verify README rules table sync"
              run: "npm run sync:readme-rules-table"

            - name: "Typecheck"
              run: "npm run typecheck"

            - name: "Run tests with coverage and JUnit report"
              run: "npm run test:ci:coverage"
              env:
                  CI: "true"
                  MAX_THREADS: "1"
                  RUNTIME_CLEANUP_VITEST_HANGING_PROCESS_REPORTER: "true"
                  VITEST_HANGING_PROCESS_REPORTER: "true"

            - name: "Verify coverage artifact"
              run: >-
                  python -c "from pathlib import Path; assert Path('coverage/lcov.info').is_file(), 'coverage/lcov.info was not generated'"

            - name: "Verify JUnit artifact"
              run: >-
                  python -c "from pathlib import Path; assert Path('test-report.junit.xml').is_file(), 'test-report.junit.xml was not generated'"

            - name: "Upload test results to Codecov"
              if: "${{ !cancelled() }}"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              with:
                  use_oidc: true
                  slug: "${{ github.repository }}"
                  files: "test-report.junit.xml"
                  flags: "${{ matrix.codecov_flag }}"
                  name: "vitest-junit-${{ matrix.codecov_flag }}"
                  report_type: "test_results"
                  fail_ci_if_error: true
                  disable_search: true
                  verbose: true

            - name: "Upload coverage to Codecov"
              if: "${{ !cancelled() }}"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              with:
                  use_oidc: true
                  slug: "${{ github.repository }}"
                  files: "./coverage/lcov.info"
                  flags: "${{ matrix.codecov_flag }}"
                  name: "vitest-unit-coverage-${{ matrix.codecov_flag }}"
                  report_type: "coverage"
                  fail_ci_if_error: true
                  disable_search: true
                  verbose: true

    eslint9-compat:
        name: "ESLint 9 Compatibility (${{ matrix.label }})"
        runs-on: "ubuntu-latest"
        timeout-minutes: 20
        permissions:
            contents: "read"
        strategy:
            fail-fast: true
            matrix:
                include:
                    - eslint-js-version: "9.0.0"
                      eslint-version: "9.0.0"
                      label: "9.0.0"
                    - eslint-js-version: "^9.39.1"
                      eslint-version: "^9.39.1"
                      label: "9.latest"
        defaults:
            run:
                shell: "bash"

        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              uses: "step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40" # v2.20.1
              with:
                  egress-policy: "audit"

            - name: "Checkout repository"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

            - name: "Setup Node.js without package-manager caching"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"
                  package-manager-cache: false

            - name: "Install the declared npm version"
              id: "npm-toolchain"
              working-directory: "${{ runner.temp }}"
              run: |
                  set -euo pipefail
                  node "$GITHUB_WORKSPACE/scripts/setup-npm-toolchain.mjs" >> "$GITHUB_OUTPUT"

            - name: "Restore npm download cache"
              uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
              with:
                  path: "${{ steps.npm-toolchain.outputs.cache }}"
                  key: "${{ runner.os }}-${{ runner.arch }}-npm-${{ steps.npm-toolchain.outputs.version }}-${{ hashFiles('package-lock.json') }}"
                  restore-keys: |
                      ${{ runner.os }}-${{ runner.arch }}-npm-${{ steps.npm-toolchain.outputs.version }}-

            - name: "Install dependencies"
              run: "npm ci"

            - name: "Build package"
              run: "npm run build"

            - name: "Create isolated ESLint 9 compatibility fixture"
              env:
                  ESLINT_JS_VERSION: "${{ matrix.eslint-js-version }}"
                  ESLINT_VERSION: "${{ matrix.eslint-version }}"
              run: |
                  set -euo pipefail

                  fixture_dir="${RUNNER_TEMP}/eslint9-compat"
                  pack_metadata_path="${fixture_dir}/npm-pack.json"
                  rm -rf "$fixture_dir"
                  mkdir -p "$fixture_dir"

                  npm pack --json --pack-destination "$fixture_dir" > "$pack_metadata_path"
                  tarball_filename=$(node scripts/read-npm-pack-filename.mjs < "$pack_metadata_path")
                  cp scripts/eslint9-compat-smoke.mjs "$fixture_dir/compat-smoke.mjs"

                  cd "$fixture_dir"
                  npm init --yes
                  npm install --ignore-scripts --no-package-lock --no-save \
                    "@eslint/js@${ESLINT_JS_VERSION}" \
                    "eslint@${ESLINT_VERSION}" \
                    "typescript@5.9.3" \
                    "./${tarball_filename}"

            - name: "Run isolated ESLint 9 compatibility smoke checks"
              env:
                  ESLINT_EXPECTED_MAJOR: "9"
              working-directory: "${{ runner.temp }}/eslint9-compat"
              run: "node compat-smoke.mjs"
